name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pytest
      # 无 GPU 环境：CUDA / Triton 用例自动跳过，仅校验参考实现与测试可收集性
      - run: pytest -q

  # GPU 自测示例（需要自托管 runner：NVIDIA 驱动 + CUDA Toolkit + MSVC/gcc）：
  #
  # test-gpu:
  #   runs-on: [self-hosted, cuda]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: python -m pytest -q
